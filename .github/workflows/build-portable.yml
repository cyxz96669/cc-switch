
  name: Build Portable (Windows)
  on:
    workflow_dispatch:

  jobs:
    build:
      runs-on: windows-2022
      steps:
        - uses: actions/checkout@v6

        - uses: actions/setup-node@v6
          with:
            node-version: '20'

        - uses: dtolnay/rust-toolchain@stable

        - uses: pnpm/action-setup@v6
          with:
            version: 10.12.3
            run_install: false

        - run: pnpm install --frozen-lockfile

        - name: Prepare Tauri signing key
          shell: bash
          run: |
            RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
            KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
            if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$RAW" > "$KEY_PATH"
            else
              if DECODED=$(printf '%s' "$RAW" | base64 --decode 2>/dev/null) \
                 && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
                printf '%s\n' "$DECODED" > "$KEY_PATH"
              else
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$(echo "$RAW" | tr -d '\r\n')" > "$KEY_PATH"
              fi
            fi
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            fi

        - name: Build
          run: pnpm tauri build

        - name: Package portable zip
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path release-assets | Out-Null
            $exePath = 'src-tauri/target/release/cc-switch.exe'
            if (Test-Path $exePath) {
              $portableDir = 'release-assets/CC-Switch-Portable'
              New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
              Copy-Item $exePath $portableDir
              @('# CC Switch portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
              Compress-Archive -Path "$portableDir/*" -DestinationPath 'release-assets/CC-Switch-dev-Windows-Portable.zip' -Force
              Write-Host "Portable zip created"
            } else {
              Write-Error 'cc-switch.exe not found'
            }

        - uses: actions/upload-artifact@v7
          with:
            name: cc-switch-portable
            path: release-assets/CC-Switch-dev-Windows-Portable.zip
